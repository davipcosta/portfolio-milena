<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a2a1d" />
      <stop offset="45%" stop-color="#5c2418" />
      <stop offset="100%" stop-color="#42160e" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2a1b14" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle badge in the project's primary brown -->
  <rect width="512" height="512" rx="124" fill="url(#brown-grad)" />

  <!-- Inner subtle border highlight for refined depth -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="#f1e6d3" stroke-width="2" stroke-opacity="0.12" />

  <!-- Modern, fluid, empathetic 'M' monogram in warm linen cream (#f1e6d3) -->
  <g filter="url(#soft-shadow)">
    <path
      d="M 136 364
         L 136 196
         C 136 148 168 132 208 162
         L 256 208
         L 304 162
         C 344 132 376 148 376 196
         L 376 364"
      fill="none"
      stroke="#f1e6d3"
      stroke-width="48"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>